<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading...</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        user-select: none;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(160deg, #f8fafc 0%, #ecfdf5 100%);
        -webkit-app-region: drag;
      }

      /* Decorative corner glows */
      body::before,
      body::after {
        content: "";
        position: fixed;
        border-radius: 50%;
        filter: blur(60px);
        pointer-events: none;
      }

      body::before {
        width: 300px;
        height: 300px;
        top: -140px;
        left: -120px;
        background: rgba(16, 185, 129, 0.14);
      }

      body::after {
        width: 280px;
        height: 280px;
        bottom: -130px;
        right: -110px;
        background: rgba(132, 204, 22, 0.1);
      }

      .container {
        text-align: center;
        animation: fade-up 0.5s ease both;
      }

      /* App icon tile */
      .icon {
        width: 88px;
        height: 88px;
        margin: 0 auto 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 22px;
        background: linear-gradient(135deg, #10b981 0%, #047857 100%);
        box-shadow:
          0 12px 32px rgba(16, 185, 129, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
        animation: breathe 2.4s ease-in-out infinite;
      }

      .icon svg {
        width: 46px;
        height: 46px;
        color: #ffffff;
      }

      .title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #0f172a;
      }

      .subtitle {
        margin-top: 6px;
        font-size: 13px;
        color: #64748b;
      }

      /* Indeterminate progress bar */
      .progress {
        position: relative;
        width: 200px;
        height: 5px;
        margin: 30px auto 0;
        border-radius: 999px;
        background: rgba(16, 185, 129, 0.12);
        overflow: hidden;
      }

      .progress::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 45%;
        border-radius: 999px;
        background: linear-gradient(90deg, #10b981, #84cc16);
        animation: slide 1.2s ease-in-out infinite;
      }

      @keyframes slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(330%);
        }
      }

      @keyframes breathe {
        0%,
        100% {
          transform: scale(1);
          box-shadow:
            0 12px 32px rgba(16, 185, 129, 0.35),
            inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        50% {
          transform: scale(1.04);
          box-shadow:
            0 16px 40px rgba(16, 185, 129, 0.45),
            inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
      }

      @keyframes fade-up {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Follow OS theme like the main app */
      @media (prefers-color-scheme: dark) {
        body {
          background: linear-gradient(160deg, #0f172a 0%, #022c22 100%);
        }

        body::before {
          background: rgba(16, 185, 129, 0.22);
        }

        body::after {
          background: rgba(132, 204, 22, 0.08);
        }

        .title {
          color: #f1f5f9;
        }

        .subtitle {
          color: #94a3b8;
        }

        .progress {
          background: rgba(148, 163, 184, 0.15);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M14 21v-3a2 2 0 0 0-4 0v3" />
          <path d="M18 4.933V21" />
          <path d="m4 6 7.106-3.79a2 2 0 0 1 1.788 0L20 6" />
          <path
            d="m6 11-3.52 2.147a1 1 0 0 0-.48.854V19a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5a1 1 0 0 0-.48-.853L18 11"
          />
          <path d="M6 4.933V21" />
          <circle cx="12" cy="9" r="2" />
        </svg>
      </div>

      <div class="title">School Management</div>
      <div class="subtitle">Preparing your workspace...</div>

      <div class="progress"></div>
    </div>
  </body>
</html>
